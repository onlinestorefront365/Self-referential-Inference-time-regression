[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "srwm"
version = "0.0.1"
description = "Stateful sequence layers that learn at inference time (SRWM, DeltaNet, LSTM) behind one contract."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "numpy"]

[tool.setuptools.packages.find]
include = ["srwm*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["srwm/core"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
